name: PR metadata

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Read event data directly. No checkout, secrets, or shell interpolation.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            // Authenticated first-party dependency PRs are tracked work items themselves.
            const dependencyTask = pr.user?.login === 'dependabot[bot]' && pr.user?.type === 'Bot'
              && pr.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
              && pr.head?.ref?.startsWith('dependabot/');
            if (!/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+/.test(pr.title)) {
              core.setFailed('Use a Conventional Commit title.');
            }
            if (!dependencyTask && !/\b(?:closes|fixes|resolves|refs|references)\s+#\d+\b/i.test(pr.body || '')) {
              core.setFailed('Link the task using Closes #N or Refs #N for partial work.');
            }
