name: Local pilot storage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pilot-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npm run pilot:build
      - run: npm run pilot:up
      - name: Empty disposable fixture migration drill
        run: |
          npm run pilot:migrate -- up
          npm run pilot:migrate -- down
          npm run pilot:migrate -- up
      - run: node --test dist/pilot/tests/pilot/migration-empty.js
      - run: npm run pilot:test
      - name: Stop, reconcile, restart with retained volumes and explicitly reopen
        run: |
          node dist/pilot/tests/pilot/dispatch-recovery.js
          npm run pilot:test
      - if: always()
        run: npm run pilot:down
      - name: Cold backup provenance and private archive access
        run: |
          test "$(id -u)" -ne 0
          git rev-parse HEAD
          mv work/pilot work/pilot-from-suite
          printf '\n' >> ops/local/README.md
          status=0
          npm run pilot:backup -- capture > work/cold-dirty.log 2>&1 || status=$?
          git restore -- ops/local/README.md
          test "$status" -eq 1
          grep -Fx 'Capture requires a clean source worktree.' work/cold-dirty.log
          test ! -e work/pilot
          printf 'throw new Error("Stale backup build executed");\n' > dist/pilot/ops/local/backup.js
          npm run pilot:backup -- capture
          npm run pilot:backup -- verify
          for archive in work/pilot/cold-backup/app-db.tar work/pilot/cold-backup/identity-db.tar; do
            test "$(stat -c '%u:%g:%a' "$archive")" = "$(id -u):$(id -g):600"
          done
