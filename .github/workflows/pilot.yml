name: Local pilot storage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pilot-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npm run pilot:build
      - run: npm run pilot:up
      - name: Empty disposable fixture migration drill
        run: |
          npm run pilot:migrate -- up
          npm run pilot:migrate -- down
          npm run pilot:migrate -- up
      - run: node --test dist/pilot/tests/pilot/migration-empty.js
      - run: npm run pilot:test
      - name: Stop, reconcile, restart with retained volumes and explicitly reopen
        run: |
          node dist/pilot/tests/pilot/dispatch-recovery.js
          npm run pilot:test
      - if: always()
        run: npm run pilot:down
      - name: Cold backup provenance and private archive access
        run: |
          test "$(id -u)" -ne 0
          git rev-parse HEAD
          mv work/pilot work/pilot-from-suite
          printf '\n' >> ops/local/README.md
          status=0
          npm run pilot:backup -- capture > work/cold-dirty.log 2>&1 || status=$?
          git restore -- ops/local/README.md
          test "$status" -eq 1
          grep -Fx 'Capture requires a clean source worktree.' work/cold-dirty.log
          test ! -e work/pilot
          printf 'throw new Error("Stale backup build executed");\n' > dist/pilot/ops/local/backup.js
          status=0
          env -u MAEX_COLD_BACKUP_KEY_FILE npm run pilot:backup -- capture > work/cold-no-key.log 2>&1 || status=$?
          test "$status" -eq 1
          grep -Fx 'Set MAEX_COLD_BACKUP_KEY_FILE to a private, external 32-byte synthetic backup key file.' work/cold-no-key.log
          test ! -e work/pilot
          key_dir="$(mktemp -d "$RUNNER_TEMP/maex-cold-key.XXXXXXXX")"
          export MAEX_COLD_BACKUP_KEY_FILE="$key_dir/key"
          trap 'rm -f -- "$MAEX_COLD_BACKUP_KEY_FILE"; rmdir -- "$key_dir"' EXIT
          node -e "require('node:fs').writeFileSync(process.env.MAEX_COLD_BACKUP_KEY_FILE, require('node:crypto').randomBytes(32), {mode: 0o600, flag: 'wx'})"
          npm run pilot:backup -- capture
          npm run pilot:backup -- verify
          for file in app-db.tar.enc identity-db.tar.enc pair.json pair.auth; do
            test "$(stat -c '%u:%g:%a' "work/pilot/cold-backup/$file")" = "$(id -u):$(id -g):600"
          done
          test ! -e work/pilot/cold-backup/app-db.tar
          test ! -e work/pilot/cold-backup/identity-db.tar
          test ! -e work/pilot/cold-backup.pending
      - name: Dedicated dispatch retention fixture
        run: |
          mv work/pilot work/pilot-from-cold-backup
          trap 'npm run pilot:down' EXIT
          npm run pilot:up -- dispatch-retention
          npm run pilot:migrate -- up
          npm run pilot:migrate -- down
          npm run pilot:migrate -- up
          node dist/pilot/tests/pilot/dispatch-retention.js
