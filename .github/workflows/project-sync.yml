name: Project reconciliation

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  pull_request_target:
    types: [opened, closed, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: vars.PROJECT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always execute trusted default-branch code, including for external PRs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate Project credentials
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: test -n "$GH_TOKEN" || { echo 'PROJECT_TOKEN is required for personal Project access.'; exit 1; }
      - name: Reconcile Project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python scripts/project_sync.py
