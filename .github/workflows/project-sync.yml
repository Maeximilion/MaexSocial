name: Project reconciliation

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  pull_request_target:
    types: [opened, edited, closed, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Issue and PR maintenance]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: project-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: vars.PROJECT_SYNC_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always execute trusted default-branch code, including for external PRs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate Project credentials
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'PROJECT_TOKEN is required for personal Project access.'; exit 1; }
          project_id=$(gh api graphql -f query='query { node(id:"PVT_kwHOBYWY284BqPE8") { ... on ProjectV2 { id } } }' --jq .data.node.id)
          test "$project_id" = 'PVT_kwHOBYWY284BqPE8' || { echo 'Credential cannot read the expected MaexSocial Project.'; exit 1; }
      - name: Reconcile Project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python scripts/project_sync.py

