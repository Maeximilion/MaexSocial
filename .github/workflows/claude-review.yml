name: Claude review (advisory)

# Supplementary only. The required code review remains gpt-6-astra with reasoning high (AGENTS.md).
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

# Never check out or execute a PR. Prepare pinned GitHub data on the default branch,
# send it in a single tool-free message, then publish with a separate GitHub token.
jobs:
  claude:
    # Automatic review of same-repository PRs (drafts and Dependabot included; fork PRs get no secrets, Dependabot
    # reads its own secret store) and @claude mentions by trusted collaborators (public repository).
    name: ${{ github.event_name == 'pull_request_target' && 'auto-review' || 'mention' }}
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Only automatic reviews of the same PR supersede each other; every mention runs on its own.
      group: claude-review-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      KIND: ${{ github.event_name == 'pull_request_target' && 'review' || 'mention' }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - id: trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare PR data
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ steps.trusted.outputs.commit }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I scripts/claude_input.py
      - id: claude
        if: steps.data.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 -I scripts/claude_messages.py
      - name: Post result
        # Trusted publisher. Per non-cancelled run: at most one review with inline findings pinned to the reviewed
        # head SHA, and exactly one summary comment (result, documented self-skip or visible failure).
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DATA_OUTCOME: ${{ steps.data.outcome }}
          WORKFLOW_CHANGED: ${{ steps.data.outputs.workflow_changed }}
          EVIDENCE: ${{ steps.data.outputs.evidence }}
          HEAD_SHA: ${{ steps.data.outputs.head_sha }}
          BASE_SHA: ${{ steps.data.outputs.base_sha }}
          GAPS: ${{ steps.data.outputs.gaps }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          FAILURE: ${{ steps.claude.outputs.failure }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess

          env = os.environ
          header = {
              "review": "**Advisory Claude review** (supplementary; does not replace the required gpt-6-astra high review)",
              "mention": "**Claude reply** (advisory; does not replace the required gpt-6-astra high review)",
          }[env["KIND"]]
          code = 0
          if env.get("DATA_OUTCOME") != "success":
              body, code = f"**Incomplete:** PR data could not be prepared. See {env['RUN_URL']}.", 1
          elif env.get("WORKFLOW_CHANGED") == "true":
              body = f"Skipped, not reviewed: {env['EVIDENCE']}."
          elif env.get("CLAUDE_OUTCOME") == "skipped":
              code = 1
              body = (f"**Incomplete:** Head `{env['HEAD_SHA']}` not reviewed: {env['GAPS']}. "
                      "No API request sent. Run the read-only preflight from an updated trusted checkout:\n\n"
                      f"`python -I scripts/claude_input.py --repo {env['GITHUB_REPOSITORY']} --pr {env['PR']} "
                      f"--base {env['BASE_SHA']} --head {env['HEAD_SHA']}`\n\n"
                      "Address the reported gaps without omitting review content; rerun preflight before updating the PR. "
                      "See `docs/tooling/claude-input-preflight.md`. Input completeness is not a review verdict.")
          elif env.get("CLAUDE_OUTCOME") != "success":
              body, code = (f"**Incomplete:** Head `{env['HEAD_SHA']}`. Failed: Claude step: "
                            f"{env.get('FAILURE') or 'unknown'}. See {env['RUN_URL']}."), 1
          else:
              mention = env["KIND"] == "mention"

              def valid(item):
                  return (isinstance(item, dict)
                          and isinstance(item.get("path"), str) and 0 < len(item["path"]) <= 300
                          and type(item.get("line")) is int and 1 <= item["line"] <= 2**31 - 1
                          and item.get("side") in ("RIGHT", "LEFT")
                          and isinstance(item.get("body"), str) and 0 < len(item["body"].strip()) <= 1000)

              try:
                  with open(os.path.join(env["RUNNER_TEMP"], "claude-result.json"), encoding="utf-8") as handle:
                      result = json.load(handle)
                  findings, overflow = result["findings"], result["overflow"]
                  summary = result["summary"] if mention else ""
              except (ValueError, KeyError, TypeError, OSError):
                  findings = None
              if not (isinstance(findings, list) and len(findings) <= 10 and all(valid(f) for f in findings)
                      and type(overflow) is bool
                      and (not mention or isinstance(summary, str) and summary.strip() and len(summary) <= 4000)):
                  body, code = f"**Incomplete:** Head `{env['HEAD_SHA']}`. Failed: invalid result. See {env['RUN_URL']}.", 1
              else:
                  head = env["HEAD_SHA"]
                  gaps = [env["GAPS"]] if env.get("GAPS") else []
                  if overflow:
                      gaps.append("additional findings omitted")
                  comments = [{"path": f["path"], "line": f["line"], "side": f["side"], "body": f["body"].strip()}
                              for f in findings]
                  count = len(comments)
                  overview = "\n".join([f"{count} {'finding' if count == 1 else 'findings'} reported."] +
                                       [f"- `{c['path']}` line {c['line']} ({c['side']}): {c['body']}" for c in comments])
                  status = ""
                  if comments:
                      review_path = os.path.join(env["RUNNER_TEMP"], "claude-review.json")
                      with open(review_path, "w", encoding="utf-8") as handle:
                          json.dump({"commit_id": head, "event": "COMMENT", "comments": comments,
                                     "body": f"{header}\n\nInline findings for `{head}`."}, handle)
                      posted = subprocess.run(["gh", "api", "--method", "POST", "--input", review_path,
                                               f"repos/{env['GITHUB_REPOSITORY']}/pulls/{env['PR']}/reviews"],
                                              capture_output=True, text=True)
                      if posted.returncode == 0:
                          status = f"{len(comments)} inline finding(s) published on `{head}`."
                      else:
                          # GitHub rejects the whole review if one line is outside the diff; keep findings visible.
                          print("::warning::GitHub rejected inline placement")
                          gaps.append("inline placement failed")
                          status = "GitHub rejected inline placement."
                  incomplete = [f"**Incomplete:** {'; '.join(gaps)}."] if gaps else []
                  body = "\n\n".join(part for part in [f"Head `{head}`.", *incomplete, summary.strip(), overview, status]
                                     if part)
                  env["GAPS"] = "; ".join(gaps)
          path = os.path.join(env["RUNNER_TEMP"], "claude-comment.md")
          with open(path, "w", encoding="utf-8") as handle:
              handle.write(f"{header}\n\n{body}\n")
          subprocess.run(["gh", "pr", "comment", env["PR"], "--repo", env["GITHUB_REPOSITORY"], "--body-file", path],
                         check=True)
          if code:
              print(f"::error::{body}")
          elif env.get("GAPS"):
              print(f"::warning::Incomplete review: {env['GAPS']}")
          raise SystemExit(code)
          PY
